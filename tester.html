<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tester Dashboard • ValoriaTiers</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>

  <style>
    .tester-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 20px 80px;
    }

    .tester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .tester-header h1 {
      margin: 0;
    }

    .tester-header p {
      color: #9da8c5;
      margin-top: 8px;
    }

    .tester-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tester-btn {
      border: 1px solid rgba(120, 100, 255, .3);
      background: rgba(80, 70, 180, .12);
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .tester-btn:hover {
      background: rgba(100, 80, 255, .25);
      transform: translateY(-2px);
    }

    .tester-btn.danger {
      border-color: rgba(255, 80, 100, .3);
      background: rgba(255, 60, 80, .1);
    }

    .tester-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .tester-stat {
      padding: 22px;
      border-radius: 16px;
      border: 1px solid rgba(120, 130, 255, .16);
      background: rgba(255,255,255,.035);
    }

    .tester-stat span {
      color: #929bb5;
      font-size: 13px;
    }

    .tester-stat strong {
      display: block;
      font-size: 30px;
      margin-top: 5px;
    }

    .login-box,
    .access-box {
      max-width: 460px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(120, 100, 255, .2);
      background: rgba(20, 22, 45, .7);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .login-box h1,
    .access-box h1 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #aab3ce;
      font-size: 13px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(130,140,180,.2);
      background: rgba(255,255,255,.045);
      color: white;
      padding: 12px;
      border-radius: 10px;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(130,110,255,.7);
    }

    .login-btn,
    .submit-btn {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #635bff, #8b5cf6);
      cursor: pointer;
      font-weight: 700;
      margin-top: 5px;
    }

    .login-btn:hover,
    .submit-btn:hover {
      filter: brightness(1.1);
    }

    .message {
      margin-top: 12px;
      font-size: 13px;
      color: #aab3ce;
    }

    .queue {
      display: grid;
      gap: 18px;
    }

    .test-card {
      padding: 22px;
      border-radius: 18px;
      border: 1px solid rgba(120, 130, 255, .15);
      background: rgba(255,255,255,.035);
      animation: cardIn .35s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .test-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .player-name {
      font-size: 21px;
      font-weight: 800;
    }

    .game-tag {
      display: inline-block;
      margin-top: 5px;
      color: #aeb7d5;
      font-size: 13px;
    }

    .pending-tag {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,180,70,.1);
      color: #ffc66d;
      font-size: 12px;
      white-space: nowrap;
    }

    .test-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .meta-box {
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.025);
    }

    .meta-box span {
      display: block;
      color: #7f89a7;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .meta-box strong {
      font-size: 13px;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      border-radius: 18px;
      border: 1px dashed rgba(130,140,180,.2);
      color: #8993b0;
    }

    @media(max-width: 700px) {
      .tester-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .tester-stats {
        grid-template-columns: 1fr;
      }

      .test-meta {
        grid-template-columns: 1fr;
      }

      .test-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginSection" class="login-box">
    <h1>Tester Login</h1>
    <p style="color:#9da8c5;">
      Sign in with your ValoriaTiers tester account.
    </p>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="tester@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <button class="login-btn" id="loginBtn">
      Sign In
    </button>

    <div class="message" id="loginMessage"></div>
  </section>


  <!-- ACCESS DENIED -->
  <section id="accessSection" class="access-box" style="display:none;">
    <h1>Access Denied</h1>
    <p style="color:#9da8c5;">
      This account is not registered as a ValoriaTiers tester.
    </p>

    <button class="tester-btn danger" id="accessLogout">
      Sign Out
    </button>
  </section>


  <!-- DASHBOARD -->
  <main id="dashboard" style="display:none;">
    <div class="tester-wrap">

      <div class="tester-header">
        <div>
          <h1>Tester Dashboard</h1>
          <p id="testerEmail">Loading tester...</p>
        </div>

        <div class="tester-actions">
          <button class="tester-btn" id="refreshBtn">
            ↻ Refresh
          </button>

          <button class="tester-btn danger" id="logoutBtn">
            Sign Out
          </button>
        </div>
      </div>


      <div class="tester-stats">

        <div class="tester-stat">
          <span>Pending Tests</span>
          <strong id="pendingCount">0</strong>
        </div>

        <div class="tester-stat">
          <span>Total Tests</span>
          <strong id="totalCount">0</strong>
        </div>

        <div class="tester-stat">
          <span>Your Tester ID</span>
          <strong id="testerShortId">---</strong>
        </div>

      </div>


      <div class="queue" id="queue">
        <div class="empty">
          Loading test queue...
        </div>
      </div>

    </div>
  </main>


<script>
  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginSection = document.getElementById("loginSection");
  const accessSection = document.getElementById("accessSection");
  const dashboard = document.getElementById("dashboard");

  const loginBtn = document.getElementById("loginBtn");
  const loginMessage = document.getElementById("loginMessage");

  const queue = document.getElementById("queue");
  const pendingCount = document.getElementById("pendingCount");
  const totalCount = document.getElementById("totalCount");

  let currentUser = null;

  const TIERS = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
  ];


  function showLogin() {
    loginSection.style.display = "block";
    accessSection.style.display = "none";
    dashboard.style.display = "none";
  }


  function showAccessDenied() {
    loginSection.style.display = "none";
    accessSection.style.display = "block";
    dashboard.style.display = "none";
  }


  function showDashboard() {
    loginSection.style.display = "none";
    accessSection.style.display = "none";
    dashboard.style.display = "block";
  }


  async function checkTester(user) {

    const { data, error } = await client
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      console.error(error);
      return false;
    }

    return data && data.role === "tester";
  }


  async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      loginMessage.textContent = "Enter your email and password.";
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    loginMessage.textContent = "";

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginMessage.textContent = error.message;
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";
      return;
    }

    const allowed = await checkTester(data.user);

    if (!allowed) {
      await client.auth.signOut();

      loginMessage.textContent =
        "This account does not have tester access.";

      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In";

      showAccessDenied();
      return;
    }

    currentUser = data.user;

    showDashboard();
    await loadDashboard();

    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }


  async function loadDashboard() {

    if (!currentUser) return;

    document.getElementById("testerEmail").textContent =
      currentUser.email || "Tester";

    document.getElementById("testerShortId").textContent =
      currentUser.id.slice(0, 8);

    const { data: tests, error } = await client
      .from("tests")
      .select(`
        id,
        player_id,
        gamemode,
        tier,
        result,
        evidence_url,
        notes,
        created_at
      `)
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);

      queue.innerHTML = `
        <div class="empty">
          Failed to load test queue.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }

    totalCount.textContent = tests.length;

    const pending = tests.filter(
      test => test.tier === "Pending"
    );

    pendingCount.textContent = pending.length;

    if (!pending.length) {
      queue.innerHTML = `
        <div class="empty">
          <h3>No pending tests 🎉</h3>
          <p>You're all caught up.</p>
        </div>
      `;

      return;
    }

    const playerIds = [
      ...new Set(
        pending.map(test => test.player_id)
      )
    ];

    const { data: players, error: playersError } =
      await client
        .from("players")
        .select(`
          id,
          minecraft_username,
          uuid,
          discord_id,
          region
        `)
        .in("id", playerIds);

    if (playersError) {
      console.error(playersError);
    }

    const playerMap = {};

    (players || []).forEach(player => {
      playerMap[player.id] = player;
    });

    queue.innerHTML = pending
      .map(test => createTestCard(
        test,
        playerMap[test.player_id]
      ))
      .join("");
  }


  function createTestCard(test, player) {

    const username =
      player?.minecraft_username || "Unknown Player";

    const uuid =
      player?.uuid || "Not provided";

    const discord =
      player?.discord_id || "Not provided";

    const region =
      player?.region || "Unknown";

    const tierOptions = TIERS
      .map(tier => `
        <option value="${tier}">
          ${tier}
        </option>
      `)
      .join("");

    return `
      <article class="test-card" id="test-${test.id}">

        <div class="test-top">

          <div>
            <div class="player-name">
              ${escapeHtml(username)}
            </div>

            <span class="game-tag">
              ${escapeHtml(test.gamemode)}
            </span>
          </div>

          <span class="pending-tag">
            PENDING
          </span>

        </div>


        <div class="test-meta">

          <div class="meta-box">
            <span>UUID</span>
            <strong>
              ${escapeHtml(uuid)}
            </strong>
          </div>

          <div class="meta-box">
            <span>Discord</span>
            <strong>
              ${escapeHtml(discord)}
            </strong>
          </div>

          <div class="meta-box">
            <span>Region</span>
            <strong>
              ${escapeHtml(region)}
            </strong>
          </div>

        </div>


        <div class="field">
          <label>Tier</label>

          <select id="tier-${test.id}">
            ${tierOptions}
          </select>
        </div>


        <div class="field">
          <label>Result</label>

          <select id="result-${test.id}">
            <option value="Passed">Passed</option>
            <option value="Failed">Failed</option>
          </select>
        </div>


        <div class="field">
          <label>Evidence URL</label>

          <input
            id="evidence-${test.id}"
            type="url"
            placeholder="https://..."
          >
        </div>


        <div class="field">
          <label>Notes</label>

          <textarea
            id="notes-${test.id}"
            placeholder="Optional test notes..."
          ></textarea>
        </div>


        <button
          class="submit-btn"
          onclick="submitTest('${test.id}')"
        >
          Submit Result
        </button>

        <div
          class="message"
          id="message-${test.id}"
        ></div>

      </article>
    `;
  }


  async function submitTest(testId) {

    if (!currentUser) return;

    const tier =
      document.getElementById(`tier-${testId}`).value;

    const result =
      document.getElementById(`result-${testId}`).value;

    const evidence =
      document.getElementById(`evidence-${testId}`).value.trim();

    const notes =
      document.getElementById(`notes-${testId}`).value.trim();

    const card =
      document.getElementById(`test-${testId}`);

    const message =
      document.getElementById(`message-${testId}`);

    const button =
      card.querySelector(".submit-btn");

    button.disabled = true;
    button.textContent = "Submitting...";
    message.textContent = "";

    const { error } = await client
      .from("tests")
      .update({
        tier,
        result,
        evidence_url: evidence || null,
        notes: notes || null,
        tester_id: currentUser.id
      })
      .eq("id", testId)
      .eq("tier", "Pending");

    if (error) {

      console.error(error);

      message.textContent =
        "Failed: " + error.message;

      button.disabled = false;
      button.textContent = "Submit Result";

      return;
    }


    /*
      Remove instantly from the UI.
      This makes the dashboard feel live.
    */

    card.style.opacity = "0";
    card.style.transform = "translateY(-8px)";

    setTimeout(() => {

      card.remove();

      pendingCount.textContent =
        Math.max(
          0,
          Number(pendingCount.textContent) - 1
        );

      if (!queue.querySelector(".test-card")) {
        queue.innerHTML = `
          <div class="empty">
            <h3>No pending tests 🎉</h3>
            <p>You're all caught up.</p>
          </div>
        `;
      }

    }, 250);


    /*
      Refresh counts/data in the background.
    */

    setTimeout(loadDashboard, 1000);
  }


  async function logout() {

    await client.auth.signOut();

    currentUser = null;

    showLogin();

    loginMessage.textContent = "";
  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  loginBtn.addEventListener("click", login);

  document.getElementById("refreshBtn")
    .addEventListener("click", loadDashboard);

  document.getElementById("logoutBtn")
    .addEventListener("click", logout);

  document.getElementById("accessLogout")
    .addEventListener("click", logout);


  document.getElementById("password")
    .addEventListener("keydown", event => {

      if (event.key === "Enter") {
        login();
      }

    });


  /*
    Check existing Supabase session.
  */

  async function init() {

    const {
      data: { session }
    } = await client.auth.getSession();

    if (!session) {
      showLogin();
      return;
    }

    const allowed =
      await checkTester(session.user);

    if (!allowed) {

      await client.auth.signOut();

      showAccessDenied();

      return;
    }

    currentUser = session.user;

    showDashboard();

    await loadDashboard();
  }


  init();
</script>

</body>
</html>
