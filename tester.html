<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tester Dashboard | ValoriaTiers</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background:
        radial-gradient(circle at top right, rgba(92, 70, 255, 0.15), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0, 170, 255, 0.08), transparent 35%),
        #070914;
    }

    .tester-wrapper {
      max-width: 1150px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .tester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tester-header h1 {
      margin: 0;
    }

    .tester-header p {
      color: #8d93ad;
      margin-top: 8px;
    }

    .tester-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(16, 19, 38, 0.8);
      border: 1px solid rgba(125, 108, 255, 0.16);
      border-radius: 18px;
      padding: 22px;
      transition: 0.25s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: rgba(125, 108, 255, 0.4);
    }

    .stat-label {
      color: #8d93ad;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 800;
    }

    .login-box {
      max-width: 450px;
      margin: 100px auto;
      padding: 35px;
      background: rgba(16, 19, 38, 0.9);
      border: 1px solid rgba(125, 108, 255, 0.2);
      border-radius: 22px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    .login-box h1 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #aeb4ce;
      font-size: 13px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0c0f20;
      color: #fff;
      border: 1px solid #272c48;
      border-radius: 11px;
      padding: 12px 13px;
      outline: none;
      font: inherit;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #7467ff;
    }

    .login-error,
    .dashboard-error {
      color: #ff7d91;
      background: rgba(255, 60, 90, 0.08);
      border: 1px solid rgba(255, 60, 90, 0.2);
      padding: 12px;
      border-radius: 10px;
      margin-top: 14px;
      display: none;
    }

    .requests-grid {
      display: grid;
      gap: 18px;
    }

    .request-card {
      background: rgba(16, 19, 38, 0.82);
      border: 1px solid rgba(125, 108, 255, 0.16);
      border-radius: 20px;
      padding: 22px;
      transition: 0.25s ease;
    }

    .request-card:hover {
      border-color: rgba(125, 108, 255, 0.35);
      transform: translateY(-2px);
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .player-name {
      font-size: 21px;
      font-weight: 800;
    }

    .player-meta {
      color: #8d93ad;
      font-size: 13px;
      margin-top: 5px;
    }

    .gamemode-badge {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(116, 103, 255, 0.12);
      border: 1px solid rgba(116, 103, 255, 0.25);
      color: #b9b2ff;
      font-weight: 700;
      font-size: 13px;
    }

    .request-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .request-form .full {
      grid-column: 1 / -1;
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 5px;
    }

    .empty-state {
      text-align: center;
      padding: 55px 20px;
      color: #8d93ad;
      background: rgba(16, 19, 38, 0.55);
      border: 1px dashed #292e49;
      border-radius: 20px;
    }

    .empty-state strong {
      display: block;
      color: #fff;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .loading {
      text-align: center;
      color: #8d93ad;
      padding: 40px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .request-form {
        grid-template-columns: 1fr;
      }

      .request-form .full {
        grid-column: auto;
      }

      .submit-row {
        justify-content: stretch;
      }

      .submit-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginSection">

    <div class="login-box">

      <div class="eyebrow">VALORIATIERS</div>

      <h1>Tester Login</h1>

      <p class="muted">
        Staff access only. Sign in with your tester account.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label>Email</label>
          <input
            id="email"
            type="email"
            placeholder="tester@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            required
          >
        </div>

        <button class="navbtn" type="submit" style="width:100%;">
          Sign In
        </button>

      </form>

      <div id="loginError" class="login-error"></div>

    </div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboardSection" class="hidden">

    <div class="tester-wrapper">

      <div class="tester-header">

        <div>
          <div class="eyebrow">STAFF PANEL</div>

          <h1>Tester Dashboard</h1>

          <p id="testerEmail">
            Loading tester...
          </p>
        </div>

        <div class="tester-actions">

          <button id="refreshBtn" class="navbtn">
            ↻ Refresh
          </button>

          <button id="logoutBtn" class="navbtn">
            Logout
          </button>

        </div>

      </div>


      <!-- STATS -->
      <div class="stats-grid">

        <div class="stat-card">
          <div class="stat-label">
            Pending Tests
          </div>

          <div id="pendingCount" class="stat-value">
            0
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-label">
            Tester Status
          </div>

          <div class="stat-value">
            Verified
          </div>
        </div>


        <div class="stat-card">
          <div class="stat-label">
            System
          </div>

          <div class="stat-value">
            Online
          </div>
        </div>

      </div>


      <div id="dashboardError" class="dashboard-error"></div>


      <!-- REQUESTS -->
      <div>

        <div class="section-title">
          Pending Test Requests
        </div>

        <div
          id="requestsContainer"
          class="requests-grid"
        >

          <div class="loading">
            Loading requests...
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script>

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginSection =
      document.getElementById("loginSection");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const loginForm =
      document.getElementById("loginForm");

    const loginError =
      document.getElementById("loginError");

    const dashboardError =
      document.getElementById("dashboardError");

    const requestsContainer =
      document.getElementById("requestsContainer");

    const pendingCount =
      document.getElementById("pendingCount");

    const testerEmail =
      document.getElementById("testerEmail");


    /*
      SHOW ERROR
    */

    function showLoginError(message) {

      loginError.textContent = message;
      loginError.style.display = "block";

    }


    function showDashboardError(message) {

      dashboardError.textContent = message;
      dashboardError.style.display = "block";

    }


    function clearDashboardError() {

      dashboardError.textContent = "";
      dashboardError.style.display = "none";

    }


    /*
      CHECK TESTER ROLE
    */

    async function checkTester() {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        showLogin();

        return false;

      }


      const {
        data: roleData,
        error: roleError
      } = await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();


      if (roleError) {

        showLoginError(
          roleError.message
        );

        return false;

      }


      if (!roleData || roleData.role !== "tester") {

        await supabaseClient.auth.signOut();

        showLoginError(
          "Access denied. This account is not a ValoriaTiers tester."
        );

        showLogin();

        return false;

      }


      testerEmail.textContent =
        `Signed in as ${user.email}`;

      showDashboard();

      return true;

    }


    /*
      LOGIN
    */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        loginError.style.display = "none";

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        const {
          error
        } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


        if (error) {

          showLoginError(error.message);

          return;

        }


        await checkTester();

      }
    );


    /*
      SHOW / HIDE
    */

    function showLogin() {

      loginSection.classList.remove("hidden");

      dashboardSection.classList.add("hidden");

    }


    function showDashboard() {

      loginSection.classList.add("hidden");

      dashboardSection.classList.remove("hidden");

      loadRequests();

    }


    /*
      LOAD PENDING TESTS
    */

    async function loadRequests() {

      clearDashboardError();

      requestsContainer.innerHTML = `
        <div class="loading">
          Loading pending tests...
        </div>
      `;


      const {
        data: tests,
        error: testsError
      } = await supabaseClient
        .from("tests")
        .select("*")
        .eq("tier", "Pending")
        .order("created_at", {
          ascending: true
        });


      if (testsError) {

        showDashboardError(
          testsError.message
        );

        requestsContainer.innerHTML = "";

        return;

      }


      pendingCount.textContent =
        tests.length;


      if (!tests.length) {

        requestsContainer.innerHTML = `
          <div class="empty-state">

            <strong>No pending tests</strong>

            All current test requests have been processed.

          </div>
        `;

        return;

      }


      /*
        GET PLAYER IDS
      */

      const playerIds = [
        ...new Set(
          tests.map(test => test.player_id)
        )
      ];


      const {
        data: players,
        error: playersError
      } = await supabaseClient
        .from("players")
        .select("*")
        .in("id", playerIds);


      if (playersError) {

        showDashboardError(
          playersError.message
        );

        return;

      }


      const playerMap = {};

      players.forEach(player => {

        playerMap[player.id] = player;

      });


      requestsContainer.innerHTML =
        tests.map(test => {

          const player =
            playerMap[test.player_id] || {};


          const username =
            player.minecraft_username ||
            "Unknown Player";

          const region =
            player.region ||
            "Unknown";

          const discord =
            player.discord_id ||
            "Not provided";


          return `

            <div class="request-card">

              <div class="request-top">

                <div>

                  <div class="player-name">
                    ${escapeHTML(username)}
                  </div>

                  <div class="player-meta">
                    Region: ${escapeHTML(region)}
                    • Discord:
                    ${escapeHTML(discord)}
                  </div>

                </div>

                <div class="gamemode-badge">
                  ${escapeHTML(test.gamemode)}
                </div>

              </div>


              <div class="request-form">


                <!-- TIER -->

                <div class="form-group">

                  <label>
                    Tier
                  </label>

                  <select
                    class="tier-select"
                    data-test-id="${test.id}"
                  >

                    <option value="">
                      Select Tier
                    </option>

                    <option value="HT1">HT1</option>
                    <option value="LT1">LT1</option>
                    <option value="HT2">HT2</option>
                    <option value="LT2">LT2</option>
                    <option value="HT3">HT3</option>
                    <option value="LT3">LT3</option>
                    <option value="HT4">HT4</option>
                    <option value="LT4">LT4</option>
                    <option value="HT5">HT5</option>
                    <option value="LT5">LT5</option>

                  </select>

                </div>


                <!-- RESULT -->

                <div class="form-group">

                  <label>
                    Result
                  </label>

                  <select
                    class="result-select"
                    data-test-id="${test.id}"
                  >

                    <option value="">
                      Select Result
                    </option>

                    <option value="Passed">
                      Passed
                    </option>

                    <option value="Failed">
                      Failed
                    </option>

                  </select>

                </div>


                <!-- EVIDENCE -->

                <div class="form-group full">

                  <label>
                    Evidence URL
                  </label>

                  <input
                    class="evidence-input"
                    data-test-id="${test.id}"
                    type="url"
                    placeholder="https://youtube.com/... or evidence link"
                  >

                </div>


                <!-- NOTES -->

                <div class="form-group full">

                  <label>
                    Tester Notes
                  </label>

                  <textarea
                    class="notes-input"
                    data-test-id="${test.id}"
                    placeholder="Optional notes about the player's performance..."
                  ></textarea>

                </div>


                <!-- SUBMIT -->

                <div class="submit-row full">

                  <button
                    class="navbtn submit-test"
                    data-test-id="${test.id}"
                  >
                    Submit Result
                  </button>

                </div>


              </div>

            </div>

          `;

        }).join("");


      /*
        BUTTON EVENTS
      */

      document
        .querySelectorAll(".submit-test")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => submitTest(button.dataset.testId)
          );

        });

    }


    /*
      SUBMIT TEST
    */

    async function submitTest(testId) {

      clearDashboardError();


      const tierElement =
        document.querySelector(
          `.tier-select[data-test-id="${testId}"]`
        );

      const resultElement =
        document.querySelector(
          `.result-select[data-test-id="${testId}"]`
        );

      const evidenceElement =
        document.querySelector(
          `.evidence-input[data-test-id="${testId}"]`
        );

      const notesElement =
        document.querySelector(
          `.notes-input[data-test-id="${testId}"]`
        );


      const tier =
        tierElement.value;

      const result =
        resultElement.value;

      const evidence =
        evidenceElement.value.trim();

      const notes =
        notesElement.value.trim();


      if (!tier) {

        alert("Please select a tier.");

        return;

      }


      if (!result) {

        alert("Please select Passed or Failed.");

        return;

      }


      /*
        GET CURRENT TESTER
      */

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        alert("Your session has expired.");

        showLogin();

        return;

      }


      /*
        UPDATE TEST
      */

      const {
        error
      } = await supabaseClient
        .from("tests")
        .update({

          tier: tier,

          result: result,

          evidence_url:
            evidence || null,

          notes:
            notes || null,

          tester_id:
            user.id

        })
        .eq("id", testId);


      if (error) {

        showDashboardError(
          "Could not submit result: " +
          error.message
        );

        return;

      }


      alert(
        "Test result submitted successfully!"
      );


      /*
        RELOAD QUEUE
      */

      loadRequests();

    }


    /*
      LOGOUT
    */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await supabaseClient.auth.signOut();

          showLogin();

        }
      );


    /*
      REFRESH
    */

    document
      .getElementById("refreshBtn")
      .addEventListener(
        "click",
        async () => {

          await loadRequests();

        }
      );


    /*
      HTML ESCAPE
    */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      AUTH STATE
    */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          await checkTester();

        } else {

          showLogin();

        }

      }
    );


    /*
      INITIAL CHECK
    */

    checkTester();

  </script>

</body>
</html>
